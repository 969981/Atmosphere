name: Sync upstream and build Atmosphere

on:
  schedule:
    # GitHub cron runs from the default branch (currently 11_support), in UTC.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: atmosphere-upstream-sync-and-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Atmosphere-NX master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_sha: ${{ steps.sync.outputs.build_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      tag: ${{ steps.sync.outputs.tag }}
      should_build: ${{ steps.sync.outputs.should_build }}
    steps:
      - name: Checkout production master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Merge official upstream safely and check release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Atmosphere-NX/Atmosphere.git
          git fetch --no-tags upstream master
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            # Preserve local CI and changes; never force-push an upstream update.
            git merge --no-edit "$upstream_sha"
            git push origin HEAD:master
          fi
          build_sha="$(git rev-parse HEAD)"
          tag="upstream-${upstream_sha:0:12}"
          {
            echo "upstream_sha=$upstream_sha"
            echo "build_sha=$build_sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo "Release already exists: $tag"
          else
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            echo "Build required: $tag"
          fi

  build:
    name: Build and package Switch firmware with devkitPro
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout synchronized production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.build_sha }}
          fetch-depth: 0

      - name: Build pinned devkitPro toolchain image
        shell: bash
        run: |
          set -euo pipefail
          # The pinned devkita64 base already includes switch-tools and hactool.
          # The upstream Dockerfile unnecessarily reinstalls them; that package
          # fetch currently returns HTTP 403 from the devkitPro mirror.
          # Patch only the ephemeral CI Dockerfile; never modify upstream source.
          sed '/^RUN dkp-pacman -S switch-tools hactool --noconfirm && dkp-pacman -Syu --noconfirm$/d' Dockerfile > Dockerfile.ci
          docker build --tag atmosphere-build-ci --file Dockerfile.ci .
          docker run --rm atmosphere-build-ci bash -lc 'command -v hactool && command -v build_romfs && command -v python2 && test -d /opt/devkitpro/devkitA64'

      - name: Order Haze shader generation before recursive NRO build
        shell: bash
        run: |
          set -euo pipefail
          # Haze's recursive build starts concurrently with ROMFS shader generation
          # under make -j2. The submake has no rule to generate the .dksh itself.
          # Patch only the CI checkout; leave upstream sources unchanged in Git.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("troposphere/haze/Makefile")
          text = path.read_text()
          before = "$(BUILD):\n\t@[ -d $@ ] || mkdir -p $@"
          after = "$(BUILD): $(ROMFS_TARGETS)\n\t@[ -d $@ ] || mkdir -p $@"
          if text.count(before) != 1:
              raise SystemExit("Haze Makefile layout changed; review shader dependency fix")
          path.write_text(text.replace(before, after))
          print("Haze shader dependencies must finish before recursive NRO build.")
          PY

      - name: Compile official release distribution
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root \
            --volume "$PWD:/source" \
            --workdir /source \
            atmosphere-build-ci \
            bash -lc 'set -euo pipefail; git config --global --add safe.directory /source; git checkout -B master; git clone --depth 1 https://github.com/switchbrew/libnx.git /tmp/libnx; git -C /tmp/libnx fetch --depth 1 origin b156b4774fb2df7b93402169509266da7547fc4c; git -C /tmp/libnx checkout --detach b156b4774fb2df7b93402169509266da7547fc4c; make -C /tmp/libnx/nx -j2 install; make -j2 dist-no-debug-nx_release'

      - name: Verify package3, fusee and all required contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive="$(find out -type f -name 'atmosphere-*.zip' -print -quit)"
          fusee="$(find out -type f -name 'fusee.bin' -print -quit)"
          if [ -z "$archive" ] || [ -z "$fusee" ]; then
            echo 'Atmosphere ZIP or fusee.bin missing; refusing to publish.'
            exit 1
          fi
          for required in atmosphere/package3 atmosphere/reboot_payload.bin switch/daybreak.nro switch/haze.nro switch/reboot_to_payload.nro; do
            unzip -Z1 "$archive" | grep -Fx "$required" > /dev/null || {
              echo "Missing required archive entry: $required"
              exit 1
            }
          done
          test -s "$fusee"
          cp "$archive" release-assets/Atmosphere-Switch.zip
          cp "$fusee" release-assets/fusee.bin

      - name: Download official Switchbrew HBLoader and HBMenu releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/switchbrew
          gh release download v2.4.5 --repo switchbrew/nx-hbloader \
            --pattern hbl.nsp --dir release-assets/switchbrew
          gh release download v3.6.1 --repo switchbrew/nx-hbmenu \
            --pattern nx-hbmenu_v3.6.1.zip --dir release-assets/switchbrew

          # Pin both official assets to the checksums published by GitHub.
          test "$(gh api repos/switchbrew/nx-hbloader/releases/tags/v2.4.5 \
            --jq '.assets[] | select(.name=="hbl.nsp") | .digest')" = \
            'sha256:853df8526557b82c6b2018a8a102d22e8306687415e49653530dfd9a1d603b32'
          test "$(gh api repos/switchbrew/nx-hbmenu/releases/tags/v3.6.1 \
            --jq '.assets[] | select(.name=="nx-hbmenu_v3.6.1.zip") | .digest')" = \
            'sha256:4790c58fdd75c4bcc644fa8135fa11c380cb3ebaf685e400e336031972410ee7'

      - name: Merge verified Homebrew components into install ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/bundle_switchbrew.py \
            --archive release-assets/Atmosphere-Switch.zip \
            --hbl release-assets/switchbrew/hbl.nsp \
            --hbmenu-zip release-assets/switchbrew/nx-hbmenu_v3.6.1.zip \
            --manifest release-assets/SWITCHBREW-SOURCES.txt
          rm -rf release-assets/switchbrew
          sha256sum release-assets/Atmosphere-Switch.zip release-assets/fusee.bin \
            release-assets/SWITCHBREW-SOURCES.txt > release-assets/SHA256SUMS.txt
          sha256sum -c release-assets/SHA256SUMS.txt
          unzip -Z1 release-assets/Atmosphere-Switch.zip | grep -Fx 'atmosphere/hbl.nsp'
          unzip -Z1 release-assets/Atmosphere-Switch.zip | grep -Fx 'hbmenu.nro'

      - name: Upload verified firmware packages
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-release-assets
          path: release-assets/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish unofficial automatic build to Releases
    needs: [sync, build]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: Atmosphere-release-assets
          path: release-assets

      - name: Publish by upstream commit SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
          BUILD_SHA: ${{ needs.sync.outputs.build_sha }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          test -s release-assets/Atmosphere-Switch.zip
          test -s release-assets/fusee.bin
          test -s release-assets/SHA256SUMS.txt
          test -s release-assets/SWITCHBREW-SOURCES.txt
          sha256sum -c release-assets/SHA256SUMS.txt
          for required in atmosphere/hbl.nsp hbmenu.nro; do
            unzip -Z1 release-assets/Atmosphere-Switch.zip | grep -Fx "$required"
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released: $TAG"
            exit 0
          fi
          printf 'Unofficial automated build of Atmosphère from the official upstream master branch.\n\nUpstream: https://github.com/Atmosphere-NX/Atmosphere\nUpstream commit: %s\nBuild commit: %s\n\nThis ZIP includes Atmosphère and official prebuilt Switchbrew HBLoader v2.4.5 and HBMenu v3.6.1; all added assets have pinned SHA256 hashes. See SWITCHBREW-SOURCES.txt for provenance. fusee.bin remains a separate boot payload. This is not an official Atmosphere release. Test compatibility and verify the target firmware version before use.\n' "$UPSTREAM_SHA" "$BUILD_SHA" > notes.md
          gh release create "$TAG" \
            release-assets/Atmosphere-Switch.zip \
            release-assets/fusee.bin \
            release-assets/SHA256SUMS.txt \
            release-assets/SWITCHBREW-SOURCES.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "Atmosphere automated build ($TAG)" \
            --notes-file notes.md \
            --latest
